name: release

# Compile quand tu publies une Release sur GitHub (bouton « Draft a new release »),
# ou à la main depuis l'onglet Actions. Les exécutables sont ajoutés à la Release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: aryadne.exe
            out: aryadne-windows-x64.exe
          - os: ubuntu-22.04
            bin: aryadne
            out: aryadne-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - run: cargo test
      - run: cargo build --release

      - name: Renommer
        shell: bash
        run: cp target/release/${{ matrix.bin }} ${{ matrix.out }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}
          generate_release_notes: true

  # L'extension Blender (add-on) : un simple .zip du dossier, installable dans Blender 4.2 et plus
  extension-blender:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Zip de l'extension
        run: |
          VERSION=$(grep '^version' blender/aryadne_blender/blender_manifest.toml | cut -d'"' -f2)
          cd blender/aryadne_blender
          zip -r "../../aryadne_blender-$VERSION.zip" . -x '__pycache__/*' '*.pyc'
          cd ../..
          echo "ZIP=aryadne_blender-$VERSION.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: aryadne-blender-extension
          path: ${{ env.ZIP }}

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
