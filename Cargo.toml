[package]
name = "aryadne"
version = "0.27.0"
edition = "2024"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ab_glyph = "0.2"
arboard = "3.7.0"
dirs = "7.0.0"
eframe = "0.37.0"
egui_tiles = "0.18"
egui_extras = { version = "0.37.0", features = ["all_loaders", "syntect"] }
flate2 = "1.1.11"
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "tga", "hdr", "exr", "rayon"] }
lzma-rs = "0.3.0"
open = "5.4.5"
rayon = "1.12.0"
regex = "1.13.2"
rfd = "0.18.0"
ruzstd = "0.9.1"
self-replace = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
ureq = { version = "3.5.2", features = ["json", "platform-verifier"] }
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }
hmac = "0.12"
sha2 = "0.10"

[build-dependencies]
winresource = "0.1.34"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
